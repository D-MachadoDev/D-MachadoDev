<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="50%" style="stop-color:#1e1b4b" />
      <stop offset="100%" style="stop-color:#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="280" fill="url(#bg)" />

  <!-- Círculos decorativos -->
  <circle cx="1100" cy="140" r="160" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.15" />
  <circle cx="1100" cy="140" r="200" fill="none" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.08" />
  <circle cx="100" cy="140" r="120" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- Puntos decorativos -->
  <circle cx="200" cy="60" r="2" fill="#8b5cf6" opacity="0.5" />
  <circle cx="320" cy="40" r="1.5" fill="#a78bfa" opacity="0.4" />
  <circle cx="450" cy="240" r="2" fill="#8b5cf6" opacity="0.5" />
  <circle cx="600" cy="40" r="1.5" fill="#a78bfa" opacity="0.4" />
  <circle cx="750" cy="240" r="2" fill="#8b5cf6" opacity="0.5" />

  <!-- Nombre -->
  <text x="60" y="110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="52" font-weight="700" fill="#f8fafc" letter-spacing="-1">David Machado</text>

  <!-- Títulos -->
  <text x="62" y="150" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="18" font-weight="500" fill="#c4b5fd">Desarrollador Full-Stack</text>
  <text x="62" y="176" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="16" fill="#94a3b8">React · Next.js · TypeScript · Python</text>

  <!-- Tagline -->
  <text x="62" y="220" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="14" fill="#64748b">Medellín, Colombia — 🚀 Construyendo productos que importan.</text>

  <!-- Badge decorativo -->
  <rect x="820" y="100" width="140" height="36" rx="18" fill="url(#accent)" opacity="0.85" filter="url(#glow)" />
  <text x="890" y="124" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="14" font-weight="600" fill="#f8fafc" text-anchor="middle">Open to work</text>

  <!-- Línea inferior decorativa -->
  <line x1="60" y1="250" x2="1140" y2="250" stroke="url(#accent)" stroke-width="1" opacity="0.25" />
  <circle cx="60" cy="250" r="3" fill="#8b5cf6" opacity="0.5" />
  <circle cx="1140" cy="250" r="3" fill="#8b5cf6" opacity="0.5" />
</svg>
