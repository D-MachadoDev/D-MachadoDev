<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="100%" style="stop-color:#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="120" fill="url(#bg)" />

  <!-- Línea decorativa -->
  <line x1="60" y1="40" x2="1140" y2="40" stroke="url(#accent)" stroke-width="1" opacity="0.2" />

  <!-- Texto -->
  <text x="600" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="16" font-weight="500" fill="#c4b5fd" text-anchor="middle">Desarrollador Full-Stack · Medellín, Colombia</text>
  <text x="600" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">🚀 Construyendo productos que importan — © 2025 David Machado</text>

  <!-- Puntos decorativos -->
  <circle cx="60" cy="40" r="3" fill="#8b5cf6" opacity="0.4" />
  <circle cx="1140" cy="40" r="3" fill="#8b5cf6" opacity="0.4" />
</svg>